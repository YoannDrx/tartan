name: Publier le mobile

# Déclenchement manuel uniquement : une version n'est annoncée que si packages/i18n/src/releases.ts la déclare.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "ota : mise à jour à distance. store : nouveau binaire soumis aux stores."
        required: true
        type: choice
        options: [ota, store]
      profile:
        description: "production : les binaires des stores. beta : TestFlight externe et test fermé Play."
        required: true
        type: choice
        options: [production, beta]
      platform:
        description: "Plateforme visée"
        required: true
        type: choice
        options: [all, ios, android]
      message:
        description: "Résumé interne de la publication (mode ota)"
        required: false
        type: string

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        # Expo interprète « all » comme incluant le web. La PWA est livrée par Next.
        platform: ${{ fromJSON(inputs.mode == 'ota' && inputs.platform == 'all' && '["ios","android"]' || format('["{0}"]', inputs.platform)) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Mise à jour à distance
        if: inputs.mode == 'ota'
        env:
          MESSAGE: ${{ inputs.message }}
          PLATFORM: ${{ matrix.platform }}
          PROFILE: ${{ inputs.profile }}
        # La mise à jour embarque la configuration du binaire qu'elle vise : variante, adresse de l'API, canal.
        # Sans elles, elle retomberait sur la variante de développement et viserait http://localhost:3000.
        run: |
          eval "$(node scripts/profile-env.mjs "$PROFILE")"
          eas update --channel "$EAS_CHANNEL" --environment production --platform "$PLATFORM" --message "${MESSAGE:-Publication manuelle}" --non-interactive
      - name: Binaire et soumission
        if: inputs.mode == 'store'
        env:
          PLATFORM: ${{ matrix.platform }}
          PROFILE: ${{ inputs.profile }}
        run: eas build --profile "$PROFILE" --platform "$PLATFORM" --auto-submit --non-interactive
