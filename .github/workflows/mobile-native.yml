name: Mobile natif

# Une vraie compilation Android à chaque changement mobile, sans brûler les crédits EAS.
# Les builds EAS, eux, n'ont lieu que le lundi si le mobile a changé, ou à la demande.
on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/mobile-native.yml"
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      eas:
        description: "Lancer aussi les builds EAS de préversion"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      APP_VARIANT: production
      EXPO_PUBLIC_API_URL: https://app.tartan.coach
      EXPO_PUBLIC_WEB_URL: https://tartan.coach
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: pnpm install --frozen-lockfile
      - name: Diagnostic Expo
        working-directory: apps/mobile
        # Version fixée : la 1.21.7, publiée le 11 novembre 2026, ne démarre pas (« @expo/env » introuvable).
        run: pnpm dlx expo-doctor@1.21.6
      - name: Configuration de production
        working-directory: apps/mobile
        run: pnpm exec expo config --json > /dev/null
      - name: Génération du projet Android
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Compilation
        working-directory: apps/mobile/android
        # Une seule architecture : assez pour prouver que le natif compile, sans dépasser le temps alloué.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

  # Les parcours natifs (T09) : l'app de développement, compilée pour le simulateur iOS, contre un serveur web local
  # et la graine de démonstration. Aucun secret : la base, le serveur et les comptes n'existent que dans ce job.
  maestro:
    if: github.event_name != 'schedule'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      DATABASE_URL: postgresql://tartan@localhost:5432/tartan_maestro
      DEMO_PASSWORD: maestro-mot-de-passe-de-test
      NO_AGE_EMAIL: sans-age@e2e.tartan.test
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      BETTER_AUTH_SECRET: secret-maestro-secret-maestro-secret-maestro
      CRON_SECRET: maestro-cron
      COACH_SIGNUP_MODE: public
      E2E_DISABLE_RATE_LIMIT: "true"
      RESEND_API_KEY: ""
      MUX_TOKEN_ID: ""
      MUX_TOKEN_SECRET: ""
      OPENAI_API_KEY: ""
      AI_PLANNER_ENABLED: "false"
      APPLE_TEAM_ID: TESTTEAM00
      ANDROID_SHA256_FINGERPRINTS: "AA:BB:CC"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Postgres
        run: |
          brew install postgresql@17
          echo "$(brew --prefix postgresql@17)/bin" >> "$GITHUB_PATH"
          brew services start postgresql@17
          export PATH="$(brew --prefix postgresql@17)/bin:$PATH"
          for i in $(seq 1 30); do pg_isready -h localhost && break; sleep 1; done
          createuser -h localhost -s tartan
          createdb -h localhost -O tartan tartan_maestro
      - run: pnpm install --frozen-lockfile
      - name: Base et graine de démonstration
        working-directory: apps/web
        run: |
          pnpm exec prisma migrate deploy
          pnpm exec tsx prisma/seed.ts
      - name: Serveur web local
        working-directory: apps/web
        run: |
          pnpm exec next build
          # « :: » écoute en IPv6 et en IPv4 : dans le simulateur, localhost peut se résoudre d'abord en ::1.
          nohup pnpm exec next start -H :: -p 3000 > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/health && break; sleep 2; done
          curl -sf -4 http://localhost:3000/api/health
          curl -sf -6 http://localhost:3000/api/health
      - name: Compte sans date de naissance (age-gate)
        run: |
          curl -sf -X POST http://localhost:3000/api/auth/sign-up/email \
            -H "Content-Type: application/json" -H "Origin: http://localhost:3000" \
            -d "{\"email\":\"$NO_AGE_EMAIL\",\"password\":\"$DEMO_PASSWORD\",\"name\":\"Sans Âge\"}" > /dev/null
          psql "$DATABASE_URL" -c "update \"user\" set email_verified = true where email = '$NO_AGE_EMAIL'"
          psql "$DATABASE_URL" -c "update profiles set birth_date = null where id = (select id from \"user\" where email = '$NO_AGE_EMAIL')"
          # L'écran d'âge vient après l'espace : le compte rejoint l'espace de démonstration comme athlète.
          psql "$DATABASE_URL" -c "insert into organization_members (organization_id, user_id, role, updated_at) select o.id, u.id, 'athlete', now() from organizations o, \"user\" u where o.owner_id = (select id from \"user\" where email = 'coach@demo.tartan.coach') and u.email = '$NO_AGE_EMAIL'"
      - name: Xcode 26
        # Expo SDK 55 exige le Swift de Xcode 26 ; l'image du runner garde Xcode 16 par défaut.
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$xcode" ]; then echo "Aucun Xcode 26 sur ce runner"; ls -d /Applications/Xcode*.app; exit 1; fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
      - name: App iOS pour le simulateur
        working-directory: apps/mobile
        env:
          APP_VARIANT: development
          EXPO_PUBLIC_API_URL: http://localhost:3000
          EXPO_PUBLIC_WEB_URL: http://localhost:3000
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
        run: |
          pnpm exec expo prebuild --platform ios
          # Signature ad hoc, sans compte Apple : sans signature, l'app n'a pas accès au trousseau, où la session
          # est rangée, et toute connexion échoue.
          xcodebuild -workspace ios/TartanDev.xcworkspace -scheme TartanDev -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/build" -quiet \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER=
      - name: Simulateur
        run: |
          device=$(xcrun simctl list devices available | grep -m1 -E "^ +iPhone [0-9]+ \(" | grep -oE "[0-9A-F-]{36}")
          echo "Simulateur : $(xcrun simctl list devices available | grep "$device")"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$RUNNER_TEMP/build/Build/Products/Release-iphonesimulator/TartanDev.app"
      - name: Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Parcours natifs
        working-directory: apps/mobile
        run: |
          maestro test .maestro --format junit --output "$RUNNER_TEMP/maestro.xml" --debug-output "$RUNNER_TEMP/maestro" --flatten-debug-output \
            -e APP_ID=coach.tartan.app.dev \
            -e COACH_EMAIL=coach@demo.tartan.coach \
            -e ATHLETE_EMAIL=un@demo.tartan.coach \
            -e NO_AGE_EMAIL="$NO_AGE_EMAIL" \
            -e PASSWORD="$DEMO_PASSWORD"
      - name: Journaux de l'app
        if: always()
        run: |
          xcrun simctl spawn booted log show --last 90m --style compact \
            --predicate 'process == "TartanDev" AND (eventMessage CONTAINS[c] "error" OR eventMessage CONTAINS[c] "Transport Security" OR eventMessage CONTAINS[c] "NSURL")' \
            > "$RUNNER_TEMP/app.log" 2>&1 || true
          tail -40 "$RUNNER_TEMP/app.log" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro
          path: |
            ${{ runner.temp }}/maestro.xml
            ${{ runner.temp }}/maestro
            ${{ runner.temp }}/web.log
            ${{ runner.temp }}/app.log
            ~/.maestro/tests
          if-no-files-found: ignore

  eas:
    if: github.event_name == 'schedule' || inputs.eas == true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Le mobile a-t-il changé cette semaine ?
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ -z "$(git log --since='7 days ago' --format=%H -- apps/mobile packages)" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.changes.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.skip != 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.changes.outputs.skip != 'true'
      - uses: expo/expo-github-action@v8
        if: steps.changes.outputs.skip != 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: eas build --profile preview-simulator -p ios --non-interactive --wait
        if: steps.changes.outputs.skip != 'true'
        working-directory: apps/mobile
      - run: eas build --profile preview -p android --non-interactive --wait
        if: steps.changes.outputs.skip != 'true'
        working-directory: apps/mobile
