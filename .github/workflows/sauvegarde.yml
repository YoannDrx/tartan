name: Sauvegarde quotidienne

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sauvegarde:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Exiger une destination privée avant tout export
        env:
          BACKUP_BLOB_TOKEN: ${{ secrets.BACKUP_BLOB_TOKEN }}
        run: |
          if [ -z "$BACKUP_BLOB_TOKEN" ]; then
            echo "::error::BACKUP_BLOB_TOKEN absent : sauvegarde refusée, aucun artefact public ne sera créé."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          sparse-checkout: apps/web/scripts/sauvegarde-blob.mjs
          sparse-checkout-cone-mode: false

      - name: Installer age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      # La clé publique seule est ici : GitHub ne peut pas relire la copie. Clé privée et restauration : docs/exploitation/sauvegarde.md.
      - name: Exporter et chiffrer
        env:
          NEON_BACKUP_URL: ${{ secrets.NEON_BACKUP_URL }}
          AGE_RECIPIENT: age1eyq9qj44sw7ujhjlacam4rxjnrag48hp3zw9uqwpregqpdh8mydq72kqlc
        run: |
          set -euo pipefail
          test -n "$NEON_BACKUP_URL"
          docker run --rm -e NEON_BACKUP_URL postgres:17 \
            sh -c 'pg_dump --format=custom --no-owner --no-privileges "$NEON_BACKUP_URL"' \
            | age --recipient "$AGE_RECIPIENT" --output tartan.dump.age
          test -s tartan.dump.age

      # Hors de GitHub : un store Vercel Blob privé, réservé aux sauvegardes (docs/exploitation/sauvegarde.md).
      - name: Envoyer dans Vercel Blob et purger au-delà de 30 jours
        env:
          BACKUP_BLOB_TOKEN: ${{ secrets.BACKUP_BLOB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$BACKUP_BLOB_TOKEN"
          npm install --prefix "$RUNNER_TEMP/blob" --no-save --no-audit --no-fund @vercel/blob@2.8.2 > /dev/null
          cp apps/web/scripts/sauvegarde-blob.mjs "$RUNNER_TEMP/blob/"
          node "$RUNNER_TEMP/blob/sauvegarde-blob.mjs" envoyer tartan.dump.age
          node "$RUNNER_TEMP/blob/sauvegarde-blob.mjs" purger 30

      - name: Signaler l'échec de la sauvegarde privée
        if: failure()
        run: |
          echo "::error::Sauvegarde privée non terminée. Vérifier la destination et la dernière copie restaurable."
          printf '%s\n' '## Sauvegarde en échec' 'Aucun repli vers un artefact GitHub. Vérifier la dernière copie privée et suivre docs/exploitation/sauvegarde.md.' >> "$GITHUB_STEP_SUMMARY"
