name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tartan
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tartan_test
  E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tartan_e2e
  BETTER_AUTH_SECRET: secret-de-ci-secret-de-ci-secret-de-ci-secret
  BETTER_AUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  quality:
    runs-on: ubuntu-latest
    # Une CI saine dure 35 à 40 minutes, parcours compris. Sans plafond, un serveur en panne
    # garde la PR en attente jusqu'aux six heures de GitHub.
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tartan
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bases de test
        run: |
          psql "$DATABASE_URL" -c 'create database tartan_test'
          psql "$DATABASE_URL" -c 'create database tartan_e2e'
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm design:check
      - name: Dépôts Ubuntu, résolution de secours
        # Le 11 novembre 2026, une panne DNS de Canonical a privé tous les
        # serveurs GitHub des dépôts Ubuntu pendant des heures, alors qu'un
        # résolveur public les trouvait encore. Ne fait rien quand la
        # résolution normale répond. apt vérifie la signature des paquets,
        # quelle que soit l'adresse d'où ils viennent.
        run: |
          for host in azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com; do
            if getent hosts "$host" > /dev/null; then continue; fi
            ip=$(dig +short +time=3 +tries=2 @1.1.1.1 "$host" A | grep -E '^[0-9]+(\.[0-9]+){3}$' | head -n 1 || true)
            if [ -n "$ip" ]; then
              echo "$ip $host" | sudo tee -a /etc/hosts
            else
              echo "::warning::$host ne se résout par aucun serveur"
            fi
          done
      - name: Navigateurs des parcours
        run: pnpm --filter @tartan/web exec playwright install --with-deps chromium webkit
        # Une minute d'ordinaire. apt réessaie sans fin quand le réseau du
        # serveur tombe : mieux vaut échouer et relancer.
        timeout-minutes: 10
      - name: Parcours sur le build de production (CSP et en-têtes réels)
        run: pnpm test:e2e
        env:
          E2E_PROD: "1"
      - name: Preuve de concept vidéo
        run: pnpm --filter @tartan/web exec playwright test video-poc --project=desktop
      - name: Planificateur activé avec prestataire simulé
        run: pnpm --filter @tartan/web exec playwright test ai-planner
        env:
          E2E_PROD: "1"
          E2E_AI_PLANNER_ENABLED: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright
          path: apps/web/test-results
          if-no-files-found: ignore
