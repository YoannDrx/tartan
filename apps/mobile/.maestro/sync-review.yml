# T24, synchronisation : des séries enregistrées sur une séance que le coach vient de modifier sont refusées par le
# serveur (conflit de version). Elles ne sont pas perdues : l'app propose « Vérifier mes saisies ». Seules les séries
# détaillées portent la version de la séance ; le conflit est fabriqué par scripts/bump-session.js, pendant que
# l'éditeur est ouvert. Ce flux passe en dernier, avec un autre athlète que la validation simple.
appId: ${APP_ID}
env:
  EMAIL: ${ATHLETE2_EMAIL}
---
- runFlow: flows/_sign-in.yml
- extendedWaitUntil:
    visible:
      id: session-hero
    timeout: 30000
- tapOn:
    id: start-session
- extendedWaitUntil:
    visible: "Mes séries réalisées"
    timeout: 15000
- tapOn: "Mes séries réalisées"
# L'éditeur liste chaque série de chaque exercice : le bouton est loin en bas.
- scrollUntilVisible:
    element: "Enregistrer mes séries"
    timeout: 90000
    speed: 90
- runScript:
    file: scripts/bump-session.js
    env:
      API_URL: ${API_URL}
      COACH_EMAIL: ${COACH_EMAIL}
      PASSWORD: ${PASSWORD}
- tapOn: "Enregistrer mes séries"
- extendedWaitUntil:
    visible: "Vérifier mes saisies"
    timeout: 30000
- tapOn: "Vérifier mes saisies"
- extendedWaitUntil:
    visible: "Saisies à vérifier"
    timeout: 15000
