# Réglages : consentements et suppression du compte présents et accessibles, sans rien supprimer.
# Ils vivent dans la rubrique Confidentialité du sommaire.
appId: ${APP_ID}
env:
  EMAIL: ${ATHLETE_EMAIL}
---
- runFlow: flows/_sign-in.yml
- extendedWaitUntil:
    visible:
      id: open-settings
    timeout: 30000
- tapOn:
    id: open-settings
- extendedWaitUntil:
    visible:
      id: settings-rubric-confidentialite
    timeout: 15000
- tapOn:
    id: settings-rubric-confidentialite
- extendedWaitUntil:
    visible: "Données de santé.*"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: delete-account
- tapOn:
    id: delete-account
- assertVisible: "Écris SUPPRIMER pour confirmer"
- assertVisible:
    id: delete-confirm
