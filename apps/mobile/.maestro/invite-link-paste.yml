# Première installation : le lien se colle à la main (aucun service tiers).
appId: ${APP_ID}
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: invite-link-open
    timeout: 20000
- tapOn:
    id: invite-link-open
- tapOn:
    id: invite-link-input
- inputText: "pas un lien"
- hideKeyboard
- tapOn:
    id: invite-link-submit
- assertVisible: "Ce lien n'est pas reconnu.*"
