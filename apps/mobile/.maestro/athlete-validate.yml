# Critère n°1 du produit : valider en deux touches depuis Aujourd'hui. Le jeu de données garantit une séance du jour
# non validée (prisma/seed.ts) ; ce flux passe après le mode séance, qui ne valide rien.
appId: ${APP_ID}
env:
  EMAIL: ${ATHLETE_EMAIL}
---
- runFlow: flows/_sign-in.yml
- extendedWaitUntil:
    visible:
      id: session-hero
    timeout: 30000
- tapOn:
    id: validate-done
# Le runner partagé peut exposer la feuille à l'accessibilité après cinq secondes.
# Attendre son vrai bouton sans rejouer la validation ; la mesure terrain reste distincte.
- extendedWaitUntil:
    visible:
      id: validation-finish
    timeout: 15000
- tapOn:
    id: validation-finish
- assertVisible:
    id: session-hero
- assertNotVisible:
    id: validate-done
