# Critère n°1 du produit : valider en deux touches depuis Aujourd'hui.
appId: ${APP_ID}
env:
  EMAIL: ${ATHLETE_EMAIL}
---
- runFlow: flows/_sign-in.yml
- extendedWaitUntil:
    visible:
      id: session-hero
    timeout: 30000
- runFlow:
    when:
      visible:
        id: validate-done
    commands:
      - tapOn:
          id: validate-done
      - extendedWaitUntil:
          visible:
            id: validation-finish
          timeout: 5000
      - tapOn:
          id: validation-finish
- assertVisible:
    id: session-hero
- assertNotVisible:
    id: validate-done
