# Parité mobile, lot M2 : la fiche concise, comme sur le web. Le geste d'abord, la mise en place, les étapes, les
# erreurs à éviter ; le texte complet et les explications restent sous « Détail ».
appId: ${APP_ID}
env:
  EMAIL: ${COACH_EMAIL}
---
- runFlow: flows/_sign-in.yml
- tapOn:
    text: "Plus tard|Not Now"
    optional: true
- extendedWaitUntil:
    visible: "Suivi du groupe"
    timeout: 30000
- tapOn: "Exercices.*"
- extendedWaitUntil:
    visible: "Rechercher un exercice"
    timeout: 15000
- tapOn: "Rechercher un exercice"
- inputText: "back squat"
- pressKey: Enter
- scrollUntilVisible:
    element: "Squat arrière.*"
    centerElement: true
- tapOn: "Squat arrière.*"
- extendedWaitUntil:
    visible:
      id: exercise-guide-concise
    timeout: 15000
- scrollUntilVisible:
    element:
      id: exercise-guide-media-photo
    direction: DOWN
    centerElement: true
- tapOn:
    id: exercise-guide-media-photo
- assertVisible:
    id: exercise-guide-photo
- tapOn:
    id: exercise-guide-media-motion
- assertVisible:
    id: exercise-guide-motion
# Le geste tourne en boucle : l'arrêter fige l'écran avant de défiler.
- tapOn:
    id: exercise-guide-play
    optional: true
- scrollUntilVisible:
    element:
      text: "Mise en place"
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "À éviter"
    direction: DOWN
- assertNotVisible:
    id: exercise-guide-detail-content
- scrollUntilVisible:
    element:
      id: exercise-guide-detail
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: exercise-guide-detail
    retryTapIfNoChange: true
- scrollUntilVisible:
    element:
      text: "Comment compter"
    direction: DOWN
- scrollUntilVisible:
    element:
      text: "Consignes indicatives relues par Tartan.*"
    direction: DOWN
- takeScreenshot: coach-exercise-guide
