# T24, planificateur : la demande en un écran, un seul champ, puis la séance à relire et le brouillon créé. Ni case
# « J'ai relu », ni écran de mode, ni étape « Continuer ». En CI, le serveur répond avec un prestataire factice
# (AI_PLANNER_FAKE_PROVIDER), qui n'existe jamais sur Vercel. Rejouable : l'accord et l'invite système sont
# facultatifs, et chaque passage crée un nouveau brouillon.
appId: ${APP_ID}
env:
  EMAIL: ${COACH_EMAIL}
---
- runFlow: flows/_sign-in.yml
- tapOn:
    text: "Plus tard|Not Now"
    optional: true
- extendedWaitUntil:
    visible: "Suivi du groupe"
    timeout: 30000
- tapOn: "Calendrier.*"
- tapOn: "Planificateur IA.*"
# L'accord n'est demandé qu'une fois : rejoué après un échec, le flux le trouve déjà donné.
- tapOn:
    id: ai-consent-accept
    optional: true
- extendedWaitUntil:
    visible:
      id: planner-instructions
    timeout: 30000
- assertVisible: "Étape 1 sur 2.*"
- assertNotVisible: "J.ai relu.*"
- assertNotVisible: "Continuer avec ces destinataires"
# L'espace de démonstration n'a qu'un groupe : il est déjà choisi. S'il en a d'autres, le choisir.
- tapOn:
    text: "Hauteur Démo"
    selected: false
    optional: true
- scrollUntilVisible:
    element:
      id: planner-instructions
    centerElement: true
    timeout: 15000
- waitForAnimationToEnd
- tapOn:
    id: planner-instructions
- waitForAnimationToEnd
- inputText: "Trois series de huit, deux minutes de repos"
# Champ multiligne : toucher ailleurs ne ferme pas ce clavier, mais il a une commande pour se fermer.
- hideKeyboard
- takeScreenshot: planner-request
# L'action d'envoi est collée au bas de l'écran : visible sans défiler.
- extendedWaitUntil:
    visible:
      id: planner-generate
      enabled: true
    timeout: 15000
- tapOn:
    id: planner-generate
# Le simulateur partagé de la CI met parfois plus de 30 s à rendre la proposition.
- extendedWaitUntil:
    visible: "Ta séance à relire"
    timeout: 60000
# Le titre arrive avant que la séance soit préparée (« La séance s'écrit » reste affiché jusque-là) ; tant qu'elle ne
# l'est pas, le bouton reste inactif, et l'attente sur un bouton présent mais inactif échoue sans attendre sur iOS.
- extendedWaitUntil:
    notVisible: "La séance s.écrit"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: planner-create-drafts
      enabled: true
    timeout: 30000
- assertNotVisible: "J.ai vérifié.*"
- takeScreenshot: planner-session
- tapOn:
    id: planner-create-drafts
- extendedWaitUntil:
    visible: "Brouillon créé.*"
    timeout: 30000
# Ce brouillon appartient au passage en cours. La proposition conserve la trace du brouillon supprimé.
- scrollUntilVisible:
    element: "Supprimer le brouillon"
    timeout: 20000
- tapOn: "Supprimer le brouillon"
- tapOn: "Annuler"
- assertVisible: "Supprimer le brouillon"
- tapOn: "Supprimer le brouillon"
- tapOn: "Supprimer"
- extendedWaitUntil:
    visible: "Brouillon supprimé ou devenu inaccessible.*"
    timeout: 30000
- openLink: "tartan-dev:///planner-proposals"
- runFlow: flows/_accept-deep-link.yml
- tapOn: "Brouillons créés"
- extendedWaitUntil:
    visible: "Voir les séances créées.*"
    timeout: 30000
- tapOn:
    text: "Voir les séances créées.*"
    index: 0
- extendedWaitUntil:
    visible: "Brouillon supprimé ou devenu inaccessible.*"
    timeout: 30000
