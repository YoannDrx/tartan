# Planificateur : un exercice que la bibliothèque n'a pas devient un emplacement à compléter, à sa place dans la
# séance. « Créer la fiche » ouvre la création rapide, nom, famille et charge déjà proposés ; « Créer et utiliser »
# la pose dans la séance, sans réponse écrite ni relance ; le brouillon se crée ensuite. Prestataire factice local.
# Rejouable : le mouvement porte un nom neuf à chaque passage, l'accord est facultatif.
appId: ${APP_ID}
env:
  EMAIL: ${COACH_EMAIL}
---
- runScript: scripts/planner-resolution-fixture.js
- runFlow: flows/_sign-in.yml
- tapOn:
    text: "Plus tard|Not Now"
    optional: true
- extendedWaitUntil:
    visible: "Suivi du groupe"
    timeout: 30000
- openLink: ${output.plannerUrl}
- runFlow: flows/_accept-deep-link.yml
- tapOn:
    id: ai-consent-accept
    optional: true
- extendedWaitUntil:
    visible:
      id: planner-instructions
    timeout: 30000
- tapOn:
    id: planner-instructions
- waitForAnimationToEnd
- inputText: ${output.plannerInstruction}
# Champ multiligne : la touche Retour ajoute une ligne ; faire défiler l'écran ferme le clavier.
- scroll
- tapOn:
    id: planner-generate
- extendedWaitUntil:
    visible: "Ta séance à relire"
    timeout: 60000
# Tant qu'un exercice attend sa fiche, le bouton du bas dit lequel, et ne crée pas le brouillon.
- extendedWaitUntil:
    visible:
      id: planner-complete
    timeout: 30000
- assertVisible: "Compléter « Mouvement natif de recette.*"
- assertNotVisible:
    id: planner-create-drafts
- scrollUntilVisible:
    element:
      id: planner-slot-create
    centerElement: true
- takeScreenshot: planner-slot-open
- tapOn:
    id: planner-slot-create
# Le nom est celui que le coach a dit ; la famille et la charge sont déjà choisies : un seul bouton.
- extendedWaitUntil:
    visible:
      id: planner-quick-submit
    timeout: 10000
- copyTextFrom:
    id: planner-quick-name
- assertTrue: ${maestro.copiedText === output.plannerMovement}
- takeScreenshot: planner-quick-create
- tapOn:
    id: planner-quick-submit
- extendedWaitUntil:
    visible:
      id: planner-create-drafts
      enabled: true
    timeout: 30000
- assertNotVisible:
    id: planner-slot-create
- takeScreenshot: planner-slot-filled
- tapOn:
    id: planner-create-drafts
- extendedWaitUntil:
    visible: "Brouillon créé.*"
    timeout: 30000
- takeScreenshot: planner-quick-exercise-draft
