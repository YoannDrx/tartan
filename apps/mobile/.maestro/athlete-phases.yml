# T24, phases : depuis son calendrier, l'athlète ouvre les phases de préparation de son groupe.
appId: ${APP_ID}
env:
  EMAIL: ${ATHLETE_EMAIL}
---
- runFlow: flows/_sign-in.yml
- extendedWaitUntil:
    visible:
      id: session-hero
    timeout: 30000
- tapOn: "Calendrier.*"
- tapOn: "Phases de préparation"
# Le calendrier dit déjà « Aucune phase » : on attend un repère propre à l'écran des phases.
- extendedWaitUntil:
    visible: "Afficher la période"
    timeout: 15000
