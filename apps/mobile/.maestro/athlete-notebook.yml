appId: ${APP_ID}
env:
  EMAIL: ${ATHLETE2_EMAIL}
---
- runScript: scripts/notebook-fixture.js
- runFlow: flows/_sign-in.yml
# iOS peut présenter sa demande d’enregistrement du mot de passe après le retour dans la journée.
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          text: "Plus tard|Not Now"
          optional: true
      - scrollUntilVisible:
          element:
            id: personal-planner
          centerElement: true
          timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: personal-planner
    retryTapIfNoChange: true
- tapOn:
    id: ai-consent-accept
    optional: true
- extendedWaitUntil:
    visible:
      id: planner-instructions
    timeout: 30000
- tapOn:
    id: planner-instructions
- inputText: "Squat arriere, trois series de quatre aujourd'hui."
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: planner-generate
      enabled: true
    timeout: 15000
- tapOn:
    id: planner-generate
- extendedWaitUntil:
    visible:
      id: planner-create-drafts
      enabled: true
    timeout: 60000
- tapOn:
    id: planner-create-drafts
- scrollUntilVisible:
    element:
      id: planner-open-session-0
    timeout: 30000
- tapOn:
    id: planner-open-session-0
- scrollUntilVisible:
    element:
      id: builder-review
      enabled: true
    timeout: 30000
- tapOn:
    id: builder-review
- extendedWaitUntil:
    visible:
      id: builder-confirm
      enabled: true
    timeout: 15000
- tapOn:
    id: builder-confirm
- scrollUntilVisible:
    element:
      id: builder-message
    timeout: 30000
- runScript: scripts/notebook-validation.js
- stopApp
- launchApp
- extendedWaitUntil:
    visible: ".*Tartan Athlète.*"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: validate-session-${output.clubId}
    centerElement: true
- tapOn:
    id: validate-session-${output.clubId}
- extendedWaitUntil:
    visible:
      id: validation-finish
    timeout: 15000
- tapOn:
    id: validation-finish
- scrollUntilVisible:
    element:
      id: validate-session-${output.personalId}
    centerElement: true
- tapOn:
    id: validate-session-${output.personalId}
- extendedWaitUntil:
    visible:
      id: validation-finish
    timeout: 15000
- tapOn:
    id: validation-finish
- runScript:
    file: scripts/notebook-validation.js
    env:
      VERIFY_LOGS: "yes"
