# Suivi coach : la grille s'affiche, la séance du jour s'ouvre, et l'appel s'enregistre.
appId: ${APP_ID}
env:
  EMAIL: ${COACH_EMAIL}
---
- runFlow: flows/_sign-in.yml
- extendedWaitUntil:
    visible: "Suivi du groupe"
    timeout: 30000
# La requête d'alertes arrive après la grille et la décale vers le bas.
# La graine contient des alertes : attendre leur insertion avant de viser la séance.
- extendedWaitUntil:
    visible: "Alertes"
    timeout: 30000
- waitForAnimationToEnd
- tapOn: "Force et pliométrie.*"
- extendedWaitUntil:
    visible:
      id: open-roll-call
    timeout: 15000
- tapOn:
    id: open-roll-call
- tapOn:
    id: "roll-present-.*Un"
- tapOn:
    id: roll-save
- extendedWaitUntil:
    visible:
      id: open-roll-call
    timeout: 15000
