# iOS asks once per simulator before opening a custom-scheme link.
appId: ${APP_ID}
---
- runFlow:
    when:
      visible: 'Open in .*Tartan.*|Ouvrir dans .*Tartan.*'
    commands:
      - tapOn: '^Open$|^Ouvrir$'
      # SpringBoard peut différer le lien tant que l’app n’est pas réactivée.
      - launchApp:
          stopApp: false
