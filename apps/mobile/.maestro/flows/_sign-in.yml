# Sous-parcours : connexion par e-mail et mot de passe. Variables : EMAIL, PASSWORD.
# Le clavier d'adresse d'iOS n'a pas de touche pour se fermer : on le ferme en touchant le titre, hors des champs.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: sign-in-email
    timeout: 20000
- tapOn:
    id: sign-in-email
- inputText: ${EMAIL}
- tapOn:
    id: sign-in-title
- tapOn:
    id: sign-in-use-password
- tapOn:
    id: sign-in-password
- inputText: ${PASSWORD}
- tapOn:
    id: sign-in-title
- tapOn:
    id: sign-in-submit
