# Sous-parcours : connexion par e-mail et mot de passe. Variables : EMAIL, PASSWORD.
# Le clavier d'adresse d'iOS n'a pas de touche pour se fermer : on le ferme en touchant le titre, hors des champs.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: sign-in-email
    timeout: 20000
- tapOn:
    id: sign-in-email
# Le clavier s'ouvre encore : taper trop tôt perd les premières lettres.
- waitForAnimationToEnd
# Le pilote iOS peut perdre le préfixe d'une saisie en rafale dans un champ contrôlé.
# La lecture exacte empêche de diagnostiquer ensuite à tort l'écran de majorité.
- runFlow:
    file: _type-stable.yml
    env:
      VALUE: ${EMAIL}
- copyTextFrom:
    id: sign-in-email
- assertTrue: ${maestro.copiedText === EMAIL}
- tapOn:
    id: sign-in-title
- tapOn:
    id: sign-in-use-password
- tapOn:
    id: sign-in-password
- waitForAnimationToEnd
- runFlow:
    file: _type-stable.yml
    env:
      VALUE: ${PASSWORD}
- tapOn:
    id: sign-in-title
- tapOn:
    id: sign-in-submit
