# Sous-parcours : connexion par e-mail et mot de passe. Variables : EMAIL, PASSWORD.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: sign-in-email
    timeout: 20000
- tapOn:
    id: sign-in-email
- inputText: ${EMAIL}
- hideKeyboard
- tapOn:
    id: sign-in-use-password
- tapOn:
    id: sign-in-password
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    id: sign-in-submit
