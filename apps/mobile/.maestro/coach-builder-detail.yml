# Lot 3, constructeur mobile au niveau du web : détailler série par série (échauffement compris), sortir un exercice
# d'un groupe par le menu, remplacer un exercice en autonomie dans un bloc commun. Le serveur relit le résultat.
appId: ${APP_ID}
env:
  EMAIL: ${COACH_EMAIL}
---
- runScript: scripts/create-detail.js
- runFlow: flows/_sign-in.yml
- extendedWaitUntil:
    visible: "Suivi du groupe"
    timeout: 30000
- openLink: ${output.detailBuilderUrl}
- runFlow: flows/_accept-deep-link.yml
- extendedWaitUntil:
    visible:
      id: builder-title
    timeout: 15000
# Séries détaillées : la première devient une série d'échauffement plus légère.
- scrollUntilVisible:
    element:
      id: sequence-edit-detail-a
    centerElement: true
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: sequence-edit-detail-a
# Le centrage de Maestro sur iOS ajoute un grand balayage même après avoir trouvé le bouton.
# Dans la feuille, il peut alors le faire passer sous le titre fixe avant le toucher.
- scrollUntilVisible:
    element:
      id: set-plan-toggle
    visibilityPercentage: 100
    timeout: 20000
- waitForAnimationToEnd
- tapOn:
    id: set-plan-toggle
- scrollUntilVisible:
    element:
      id: set-plan-load-0
    visibilityPercentage: 100
    timeout: 20000
- waitForAnimationToEnd
- tapOn:
    id: set-plan-warmup-0
- tapOn:
    id: set-plan-reps-0
- eraseText
- inputText: "8"
# Sur Android à 320 dp, le clavier couvre la deuxième saisie après les répétitions.
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
      - waitForAnimationToEnd
      - scrollUntilVisible:
          element:
            id: set-plan-load-0
          visibilityPercentage: 100
          timeout: 20000
- tapOn:
    id: set-plan-load-0
- eraseText
- runFlow:
    file: flows/_type-stable.yml
    env:
      VALUE: "40"
- takeScreenshot: coach-set-plan-editor
- runFlow:
    file: flows/_hide-keyboard.yml
- tapOn:
    id: prescription-apply
- extendedWaitUntil:
    notVisible:
      id: prescription-apply
    timeout: 10000
# Hors du groupe, par le menu du téléphone.
- scrollUntilVisible:
    element:
      id: sequence-advanced-detail-b
    centerElement: true
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: sequence-advanced-detail-b
- scrollUntilVisible:
    element:
      id: sequence-move-out-detail-b
    visibilityPercentage: 100
    timeout: 20000
- waitForAnimationToEnd
- tapOn:
    id: sequence-move-out-detail-b
- extendedWaitUntil:
    notVisible:
      id: sequence-move-out-detail-b
    timeout: 10000
# Remplacement en autonomie, dans le groupe : C est resté au-dessus, B est parti à la fin de la phase.
- scrollUntilVisible:
    element:
      id: sequence-advanced-detail-c
    direction: UP
    centerElement: true
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: sequence-advanced-detail-c
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: replace-autonomous-detail-c
    centerElement: true
    timeout: 20000
- waitForAnimationToEnd
- tapOn:
    id: replace-autonomous-detail-c
# La fiche est la première du sélecteur : attendre qu'il soit posé, sinon un défilement vers le bas la fait sortir
# de l'écran avant qu'elle soit vue (Android).
- extendedWaitUntil:
    visible:
      id: exercise-search
    timeout: 15000
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: exercise-option-${output.replacementId}
    direction: UP
    centerElement: true
    timeout: 20000
    optional: true
- scrollUntilVisible:
    element:
      id: exercise-option-${output.replacementId}
    centerElement: true
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: exercise-option-${output.replacementId}
- waitForAnimationToEnd
# Le sélecteur fermé, l'écran peut rester en bas de page (Android, écran de 640 dp) : la ligne est alors au-dessus.
- scrollUntilVisible:
    element:
      id: autonomous-line-detail-c
    direction: UP
    centerElement: true
    timeout: 20000
    optional: true
- scrollUntilVisible:
    element:
      id: autonomous-line-detail-c
    centerElement: true
    timeout: 20000
- takeScreenshot: coach-autonomous-replacement
- scrollUntilVisible:
    element:
      id: builder-review
    direction: DOWN
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: builder-review
- assertVisible: "Relire avant publication"
- takeScreenshot: coach-detail-preview
- tapOn:
    id: builder-confirm
- extendedWaitUntil:
    notVisible:
      id: builder-confirm
    timeout: 75000
- runScript: scripts/verify-detail-edit.js
- assertTrue: ${output.detailVerified === "oui"}
