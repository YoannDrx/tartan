# T24, constructeur : depuis le calendrier du coach, « Nouvelle séance » ouvre le constructeur, prêt à publier.
appId: ${APP_ID}
env:
  EMAIL: ${COACH_EMAIL}
---
- runFlow: flows/_sign-in.yml
- extendedWaitUntil:
    visible: "Suivi du groupe"
    timeout: 30000
- tapOn: "Calendrier"
- tapOn: "Nouvelle séance"
- extendedWaitUntil:
    visible: "Titre"
    timeout: 15000
- assertVisible: "Publier"
