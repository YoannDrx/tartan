# Photo de profil et avatars (lot M1) : la galerie « Le groupe » et « Animaux », l'avatar choisi qui suit la personne
# jusqu'au sommaire, puis le retour aux initiales par la poubelle, avec son annulation. La photo du téléphone (pellicule, appareil) n'est pas jouée ici :
# Maestro ne pilote pas le sélecteur du système. Le parcours se rejoue : il finit sur les initiales.
appId: ${APP_ID}
env:
  EMAIL: ${ATHLETE2_EMAIL}
---
- runFlow: flows/_sign-in.yml
- extendedWaitUntil:
    visible:
      id: open-settings
    timeout: 30000
- tapOn:
    id: open-settings
- extendedWaitUntil:
    visible:
      id: settings-profile
    timeout: 15000
- tapOn:
    id: settings-profile
- extendedWaitUntil:
    visible:
      id: avatar-current
    timeout: 15000
# Le « + » posé sur le bord du portrait ouvre la feuille : pellicule, appareil, avatar.
- tapOn:
    id: avatar-add
- extendedWaitUntil:
    visible:
      id: avatar-library
    timeout: 10000
- assertVisible:
    id: avatar-camera
- tapOn:
    id: avatar-choose
- extendedWaitUntil:
    visible: "Le groupe"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: avatar-preset-athlete-highJump
- scrollUntilVisible:
    element:
      id: avatar-preset-animal-fox
- assertVisible: "Animaux"
- tapOn:
    id: avatar-preset-animal-fox
- extendedWaitUntil:
    visible: "Avatar enregistré."
    timeout: 15000
- assertVisible: "Avatar de .*Renard"
# La poubelle, sur le bord gauche : annulée une fois, puis laissée partir après ses cinq secondes.
- tapOn:
    id: avatar-initials
- assertVisible: "Avatar supprimé."
- tapOn:
    id: avatar-undo
- assertVisible: "Rien n'a été supprimé."
- assertVisible: "Avatar de .*Renard"
- tapOn:
    id: avatar-initials
- extendedWaitUntil:
    visible: "Tes initiales s'affichent à nouveau."
    timeout: 20000
- assertVisible: "Initiales de .*"
