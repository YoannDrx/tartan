# Mot de passe oublié depuis l'app : la réponse ne dit pas si le compte existe.
appId: ${APP_ID}
---
# Le parcours précédent (`no-space-account`) laisse une session ouverte : on repart déconnecté.
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: sign-in-title
    timeout: 30000
- tapOn:
    id: sign-in-email
- inputText: "inconnu@e2e.tartan.test"
- tapOn:
    id: sign-in-title
- tapOn:
    id: sign-in-use-password
- tapOn:
    id: sign-in-forgot
- extendedWaitUntil:
    visible: "Si un compte existe avec cette adresse.*"
    timeout: 15000
