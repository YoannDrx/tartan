# Mot de passe oublié depuis l'app : la réponse ne dit pas si le compte existe.
appId: ${APP_ID}
---
- launchApp
- extendedWaitUntil:
    visible:
      id: sign-in-title
    timeout: 30000
- tapOn:
    id: sign-in-email
- inputText: "inconnu@e2e.tartan.test"
- tapOn: "Utiliser un mot de passe"
- tapOn:
    id: sign-in-forgot
- assertVisible: "Si un compte existe avec cette adresse.*"
