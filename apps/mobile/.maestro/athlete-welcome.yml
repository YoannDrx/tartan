# Accueil de l'athlète (lot M1) : un athlète qui vient de rejoindre son groupe par le lien d'invitation (créé par la
# CI juste avant, `NEWCOMER_EMAIL`) voit l'accueil sans qu'il passe devant sa séance, le referme d'un geste, et ne le
# revoit pas après une nouvelle connexion : l'état est gardé par le serveur, pas par le téléphone.
# Écrans déjà vus en `optional` : le parcours se rejoue.
appId: ${APP_ID}
env:
  EMAIL: ${NEWCOMER_EMAIL}
---
- runFlow: flows/_sign-in.yml
- extendedWaitUntil:
    visible:
      id: open-settings
    timeout: 30000
- waitForAnimationToEnd
# Un jour de séance, le bouton se trouve sous la séance et peut affleurer derrière les onglets iOS.
# Centrer le contrôle puis attendre l’arrêt du défilement avant de le toucher.
- scrollUntilVisible:
    element:
      id: athlete-welcome-line
    centerElement: true
    timeout: 10000
    optional: true
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: athlete-welcome-line
    commands:
      - tapOn:
          id: athlete-welcome-line
      - extendedWaitUntil:
          visible:
            text: "Bienvenue dans .*"
          timeout: 10000
- scrollUntilVisible:
    element:
      id: athlete-welcome-dismiss
    centerElement: true
    timeout: 10000
    optional: true
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: athlete-welcome-dismiss
    commands:
      - tapOn:
          id: athlete-welcome-dismiss
      - extendedWaitUntil:
          notVisible:
            id: athlete-welcome
          timeout: 10000
# Une autre connexion, comme sur un autre appareil : l'accueil ne revient pas.
- runFlow: flows/_sign-in.yml
- extendedWaitUntil:
    visible:
      id: open-settings
    timeout: 30000
- waitForAnimationToEnd
- assertNotVisible:
    id: athlete-welcome
- assertNotVisible:
    id: athlete-welcome-line
