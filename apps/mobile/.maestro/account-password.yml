# Connexion par mot de passe et rubrique Connexion (lot M1) : le compte entre par son mot de passe, voit ses moyens de
# connexion, et un mauvais mot de passe actuel est refusé sans rien changer. Le parcours se rejoue : aucun mot de
# passe n'est modifié (un essai sur les cinq que le serveur accorde en dix minutes).
appId: ${APP_ID}
env:
  EMAIL: ${ATHLETE2_EMAIL}
---
- runFlow: flows/_sign-in.yml
- extendedWaitUntil:
    visible:
      id: open-settings
    timeout: 30000
- tapOn:
    id: open-settings
- extendedWaitUntil:
    visible:
      id: settings-rubric-connexion
    timeout: 15000
- tapOn:
    id: settings-rubric-connexion
- extendedWaitUntil:
    visible:
      id: sign-in-method-link
    timeout: 15000
# Chaque moyen est une seule rangée pour le lecteur d'écran : son nom et son état se lisent ensemble.
- assertVisible:
    id: sign-in-method-link
    text: "Lien par e-mail : Toujours disponible"
- assertVisible:
    id: sign-in-method-password
    text: "Mot de passe : Défini"
- assertVisible: "Changer le mot de passe"
- tapOn:
    id: password-current
- waitForAnimationToEnd
- inputText: "pas-le-bon-mot-de-passe"
- runFlow: flows/_hide-keyboard.yml
- tapOn: "Changer le mot de passe"
- tapOn:
    id: password-next
- waitForAnimationToEnd
- inputText: "un-nouveau-mot-de-passe"
- runFlow: flows/_hide-keyboard.yml
- tapOn: "Changer le mot de passe"
# Le mot de passe se relit d'un bouton avant l'envoi.
- tapOn:
    id: password-next-reveal
- copyTextFrom:
    id: password-next
- assertTrue: ${maestro.copiedText === "un-nouveau-mot-de-passe"}
- scrollUntilVisible:
    element:
      id: password-change-submit
- tapOn:
    id: password-change-submit
- extendedWaitUntil:
    visible: "Ce n'est pas ton mot de passe actuel.*"
    timeout: 15000
# Les appareils : celui-ci reste connecté.
- scrollUntilVisible:
    element:
      id: revoke-other-sessions
- assertVisible:
    id: connexion-sign-out
