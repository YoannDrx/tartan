# Compte sans date de naissance : l'écran d'âge passe avant l'espace, et une date mineure ferme l'accès.
appId: ${APP_ID}
env:
  EMAIL: ${NO_AGE_EMAIL}
---
- runFlow: flows/_sign-in.yml
- extendedWaitUntil:
    visible:
      id: age-confirm
    timeout: 30000
- assertVisible: "Ta date de naissance"
- tapOn:
    id: birth-date
- inputText: "12052015"
- tapOn:
    id: age-confirm
# La date se confirme avant d'être enregistrée : une fois écrite, seule l'équipe peut la corriger.
- tapOn: "Confirmer cette date"
- extendedWaitUntil:
    visible: "Tartan est réservé aux majeurs"
    timeout: 15000
- assertVisible:
    id: age-sign-out
